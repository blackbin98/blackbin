<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS1 NEWS LETTER</title>
<style>
:root{
--coral:#ff5f68; --line:#ff747b; --bg:#fffdfb; --text:#111;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Pretendard,Arial,sans-serif;background:var(--bg)}
.app{height:100vh;padding:14px;display:flex;flex-direction:column}
.header{border-bottom:2px solid var(--line)}
.header h1{margin:0;color:var(--coral);font:900 72px Georgia,serif}
.info{font-size:11px;color:#888;border-top:1px solid var(--line);padding:4px 0;display:flex;justify-content:space-between}
.window{flex:1;margin-top:12px;border:2px solid var(--line);border-radius:24px;overflow:hidden;display:grid;grid-template-columns:230px 1fr}
.sidebar{padding:18px;border-right:2px solid var(--line);display:flex;flex-direction:column}
.menu button{width:100%;margin-bottom:10px;padding:12px;border-radius:999px;border:1px solid var(--coral);background:#fff;color:var(--coral);font-weight:700;cursor:pointer}
.menu button.active,.menu button:hover{background:var(--coral);color:#fff}
.note{margin-top:auto;font-size:12px;color:#777;line-height:1.6}
.content{position:relative;padding:30px;overflow:hidden}
.page{display:none;height:100%}
.page.active{display:block}
.home{display:grid;grid-template-columns:1fr 340px;height:100%}
.center{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}
.logo{width:min(420px,35vw);margin-bottom:20px}
.title{font-size:72px;line-height:1.05;font-weight:900}
.title .c{color:var(--coral)}
.desc{color:#666}
.right{display:flex;flex-direction:column;gap:16px;justify-content:center}
.weather,.profile{border:2px solid var(--coral);border-radius:24px;padding:20px;background:#fff}
.weather{text-align:center}
.temp{font-size:84px;color:var(--coral);font-weight:900}
.profile{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.profile img{width:72px;height:72px;border-radius:16px;object-fit:cover;border:1px solid var(--coral)}
h2{color:var(--coral)}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h1>PS1 NEWS LETTER</h1>
<div class="info">
<span>주소_부산광역시 남구 용소로 45</span>
<span>TEL.051.629.5450</span>
<span>PS1</span>
</div>
</div>

<div class="window">
<div class="sidebar">
<div class="menu">
<button class="active" data-page="home">오늘의 부산</button>
<button data-page="issue">부산의 이슈</button>
<button data-page="pknu">부경대 관련 뉴스</button>
<button data-page="welfare">사회복지 통계</button>
</div>
<div class="note">
클릭하면 화면이 전환됩니다.<br>
GitHub Pages용 단일 HTML 파일입니다.
</div>
</div>

<div class="content">
<div class="page active" id="home">
<div class="home">
<div class="center">
<img src="ps1_logo.png" class="logo" alt="PS1 Logo">
<div class="title"><span class="c">오늘의 부산을</span><br>한 장의 뉴스레터로</div>
<p class="desc">부산의 날씨, 지역 이슈, 부경대 소식, 사회복지 통계를 한 화면에서 확인합니다.</p>
</div>

<div class="right">
<div class="weather">
<div>BUSAN WEATHER</div>
<div class="temp" id="temp">--°</div>
<div id="weatherText">불러오는 중...</div>
</div>

<div class="profile">
<img src="profile.png" alt="프로필">
<div>
<strong style="color:#ff5f68">Editor</strong>
<div style="font-size:12px;color:#666">PS1 뉴스레터 운영자</div>
</div>
</div>
</div>
</div>
</div>

<div class="page" id="issue"><h2>부산의 이슈</h2></div>
<div class="page" id="pknu"><h2>부경대 관련 뉴스</h2></div>
<div class="page" id="welfare"><h2>사회복지 통계</h2></div>
</div>
</div>
</div>

<script>
document.querySelectorAll('.menu button').forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(btn.dataset.page).classList.add('active');
 };
});

async function weather(){
 try{
  const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.1796&longitude=129.0756&current=temperature_2m,weather_code&timezone=Asia%2FSeoul');
  const d=await r.json();
  document.getElementById('temp').textContent=Math.round(d.current.temperature_2m)+'°';
  document.getElementById('weatherText').textContent='현재 부산 날씨';
 }catch(e){}
}
weather();
</script>
</body>
</html>
